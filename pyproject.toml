[project]
name = "tirex-forecasting-pipeline"
version = "0.1.0"
description = "DIMER zero-shot forecasting pipeline for NX-AI TiRex-2"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Kurt Valcorza" }]
dependencies = [
  "tirex-2==0.2.1",
  "torch==2.8.0",
  "torchvision==0.23.0",
  "torchaudio==2.8.0",
  "huggingface-hub==0.36.2",
  "numpy==2.3.3",
  "pandas==2.3.3",
]
[project.optional-dependencies]
dev = ["pytest==9.0.2", "ruff==0.12.10"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/tirex_forecasting_pipeline"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
